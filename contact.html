<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contact — Community Rec Centre</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link sr-only-focusable" href="#main">Skip to main content</a>

  <header class="site-header navbar navbar-expand-lg navbar-light bg-light" role="banner" aria-label="Primary">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center" href="index.html">
      <img src="images/Logo(fitness).png" alt="Rec Centre logo" width="48" height="48">
      <span class="ms-2 visually-hidden">Community Rec Centre</span>
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain"
            aria-controls="navMain" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <nav id="navMain" class="collapse navbar-collapse" role="navigation">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="programs.html">Programs</a></li>
        <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
      </ul>
    </nav>
  </div>
</header>

  <main id="main" class="container py-5">
    <h1>Contact Us</h1>

    <form action="#" method="post" aria-label="Contact form" class="needs-validation" novalidate>
      <div class="mb-3">
        <label for="name" class="form-label">Your Name</label>
        <input id="name" name="name" required class="form-control" type="text" />
        <div class="invalid-feedback">Please enter your name.</div>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Your Email</label>
        <input id="email" name="email" required class="form-control" type="email" />
        <div class="invalid-feedback">Please enter a valid email address.</div>
      </div>

      <div class="mb-3">
        <label for="message" class="form-label">Your Message</label>
        <textarea id="message" name="message" rows="6" required class="form-control"></textarea>
        <div class="invalid-feedback">Please type a message.</div>
      </div>

      <button class="btn btn-primary" type="submit">Send</button>
    </form>
  </main>

  <footer class="bg-dark text-light py-3">
    <div class="container">
      <small>© <span id="year"></span> Community Rec Centre</small>
    </div>
  </footer>

  <script>
    // simple client-side validation bootstrap pattern
    (function () {
      'use strict'
      const forms = document.querySelectorAll('.needs-validation')
      Array.prototype.slice.call(forms).forEach(function (form) {
        form.addEventListener('submit', function (event) {
          if (!form.checkValidity()) {
            event.preventDefault()
            event.stopPropagation()
          }
          form.classList.add('was-validated')
        }, false)
      })
    })()
    document.getElementById('year').textContent = new Date().getFullYear()
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
